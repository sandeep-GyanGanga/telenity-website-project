<div class="container mt-3">
  <h3>Compound Interest Calculator</h3>
  <div class="mb-3">
    <label>Principal:</label>
    <input type="number" [(ngModel)]="principal" class="form-control">
  </div>
  <div class="mb-3">
    <label>Annual Interest Rate (%):</label>
    <input type="number" [(ngModel)]="rate" class="form-control">
  </div>
  <div class="mb-3">
    <label>Times Compounded Per Year:</label>
    <input type="number" [(ngModel)]="timesCompounded" class="form-control">
  </div>
  <div class="mb-3">
    <label>Years:</label>
    <input type="number" [(ngModel)]="years" class="form-control">
  </div>
  <button class="btn btn-primary" (click)="calculate()">Calculate</button>

  <div *ngIf="futureValue">
    <p class="mt-3">Future Value: {{ futureValue | currency:'INR' }}</p>
  </div>
</div>
