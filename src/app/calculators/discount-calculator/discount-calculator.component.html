<div class="container">
  <h1>Discount Calculator</h1>
  <p>Enter price and discount % to calculate final amount</p>

  <!-- Input Section -->
  <div class="form-section">
    <label for="price">Original Price</label>
    <input type="number" id="price" class="form-control"
           [(ngModel)]="originalPrice" placeholder="Enter original price" />

    <label for="discount">Discount %</label>
    <input type="number" id="discount" class="form-control"
           [(ngModel)]="discountPercentage" placeholder="Enter discount %" />

    <button class="btn" (click)="calculateDiscount()">Calculate</button>
  </div>

  <!-- Result Section -->
  <div class="results" *ngIf="finalPrice !== null">
    <h3>Result</h3>
    <p>Discount Amount: <strong>{{ discountAmount | number : '1.2-2' }}</strong></p>
    <p>Final Price: <strong>{{ finalPrice | number : '1.2-2' }}</strong></p>
  </div>
</div>
