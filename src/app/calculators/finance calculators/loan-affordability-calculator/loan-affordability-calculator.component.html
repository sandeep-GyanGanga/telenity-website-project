<div class="container py-4">
  <h2>Loan Affordability Calculator</h2>
  <form (ngSubmit)="calculate()" class="row g-3">
    <div class="col-md-3">
      <label class="form-label">Monthly Income</label>
      <input type="number" class="form-control" [(ngModel)]="income" name="income" required />
    </div>
    <div class="col-md-3">
      <label class="form-label">Monthly Expenses</label>
      <input type="number" class="form-control" [(ngModel)]="expenses" name="expenses" required />
    </div>
    <div class="col-md-3">
      <label class="form-label">Interest Rate (%)</label>
      <input type="number" class="form-control" [(ngModel)]="interestRate" name="interestRate" required />
    </div>
    <div class="col-md-3">
      <label class="form-label">Tenure (Months)</label>
      <input type="number" class="form-control" [(ngModel)]="tenureMonths" name="tenureMonths" required />
    </div>
    <div class="col-12">
      <button class="btn btn-primary">Calculate</button>
    </div>
  </form>

  <div *ngIf="maxLoan !== null" class="alert alert-info mt-3">
    Maximum Affordable Loan: ₹ {{ maxLoan | number:'1.2-2' }}
  </div>
</div>
