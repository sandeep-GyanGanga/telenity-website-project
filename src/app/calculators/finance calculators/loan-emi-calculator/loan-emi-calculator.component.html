<div class="calculator-card">
  <h3>Loan EMI Calculator</h3>
  <form (ngSubmit)="calculateEMI()">
    <div class="mb-2">
      <label>Loan Amount</label>
      <input type="number" [(ngModel)]="principal" name="principal" class="form-control" required />
    </div>
    <div class="mb-2">
      <label>Interest Rate (Annual %)</label>
      <input type="number" [(ngModel)]="rate" name="rate" class="form-control" required />
    </div>
    <div class="mb-2">
      <label>Tenure (Months)</label>
      <input type="number" [(ngModel)]="tenure" name="tenure" class="form-control" required />
    </div>
    <button class="btn btn-primary mt-2" type="submit">Calculate EMI</button>
  </form>

  <div *ngIf="emi">
    <h4 class="mt-3">EMI: ₹{{ emi | number:'1.2-2' }}</h4>
    <p>Total Payment: ₹{{ totalPayment | number:'1.2-2' }}</p>
    <p>Total Interest: ₹{{ totalInterest | number:'1.2-2' }}</p>
  </div>
</div>
