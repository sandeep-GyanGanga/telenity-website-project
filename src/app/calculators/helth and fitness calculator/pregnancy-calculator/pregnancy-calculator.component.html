<div class="container mt-3">
  <h3>Pregnancy Calculator</h3>
  <div class="mb-3">
    <label>Last Menstrual Period (LMP):</label>
    <input type="date" [(ngModel)]="lmpDate" class="form-control">
  </div>
  <button class="btn btn-primary" (click)="calculate()">Calculate</button>

  <div *ngIf="dueDate">
    <p class="mt-3">Estimated Due Date: {{ dueDate | date:'longDate' }}</p>
    <p>Current Gestational Age: {{ weeksPregnant }} weeks</p>
  </div>
</div>
